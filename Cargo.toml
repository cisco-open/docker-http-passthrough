[package]
name = "docker-http-passthrough"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "HTTP server that proxies Docker image downloads as tar archives on-the-fly"
license = "Apache-2.0"
repository = "https://github.com/cisco-open/docker-http-passthrough"
homepage = "https://github.com/cisco-open/docker-http-passthrough"
keywords = ["docker", "http", "proxy", "tar", "registry"]
categories = ["network-programming", "web-programming"]
authors = ["Cisco Systems, Inc."]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP server
axum = { version = "0.7", features = ["tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# HTTP client for registry API (using rustls to avoid OpenSSL cross-compilation issues)
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

# Tar archive creation
tar = "0.4"

# Gzip decompression for layers
flate2 = "1.0"

# Async streaming
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
bytes = "1.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# SHA256 for layer digests
sha2 = "0.10"
hex = "0.4"

# OpenTelemetry
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14", features = ["tonic"] }

# Environment variables
dotenvy = "0.15"

# Lazy static initialization
once_cell = "1.19"

# Temporary layer storage while preparing Docker save archives
tempfile = "=3.10.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
