services:
  docker-http-passthrough:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/cisco-open/docker-http-passthrough:local
    container_name: docker-http-passthrough
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-docker-http-passthrough}
      - REGISTRY_URL=${REGISTRY_URL:-https://registry-1.docker.io}
      - REGISTRY_AUTH_URL=${REGISTRY_AUTH_URL:-}
      - REGISTRY_SERVICE=${REGISTRY_SERVICE:-}
      - REGISTRY_NAME=${REGISTRY_NAME:-docker.io}
      - REGISTRY_USERNAME=${REGISTRY_USERNAME:-}
      - REGISTRY_PASSWORD=${REGISTRY_PASSWORD:-}
      - REGISTRY_BEARER_TOKEN=${REGISTRY_BEARER_TOKEN:-}
      - REGISTRY_TOKEN
      - REGISTRY_CLIENT_AUTH=${REGISTRY_CLIENT_AUTH:-optional}
      - REGISTRY_DEFAULT_NAMESPACE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
