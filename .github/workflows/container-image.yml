name: Publish OCI Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/container-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "docker-bake.hcl"
      - "src/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cisco-open/docker-http-passthrough
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Docker HTTP Passthrough
            org.opencontainers.image.description=HTTP server that proxies container registry images as Docker save-compatible tar archives
            org.opencontainers.image.vendor=Cisco Systems, Inc.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/cisco-open/docker-http-passthrough
          annotations: |
            org.opencontainers.image.title=Docker HTTP Passthrough
            org.opencontainers.image.description=HTTP server that proxies container registry images as Docker save-compatible tar archives
            org.opencontainers.image.vendor=Cisco Systems, Inc.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/cisco-open/docker-http-passthrough

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
